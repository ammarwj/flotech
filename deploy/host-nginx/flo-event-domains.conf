# ============================================================
# flo-event — custom domain per event (HOST nginx)
# Pasang SEKALI di /etc/nginx/sites-available/flo-event-domains.conf lalu
# symlink ke sites-enabled/. Isinya tidak pernah berubah lagi; yang berubah
# adalah file yang di-include di bawah, digenerate DomainService dari DB.
#
# Bootstrap: deploy/setup-custom-domains.sh
# ============================================================

# Blok server per domain, ditulis container `scheduler`.
#
# File ini WAJIB sudah ada sebelum nginx pertama kali di-reload — nginx menolak
# start kalau `include` menunjuk file yang tidak ada. setup-custom-domains.sh
# membuatnya kosong; sesudah itu `domains:sync` yang mengisinya.
#
# Perhatikan: tidak ada `default_server` maupun `server_name ~^.+$` di mana pun,
# di sini maupun di file yang digenerate. VPS ini berbagi nginx dengan stack
# `runup`: `default_server` hanya boleh satu per port, dan `server_name` regex
# dievaluasi SEBELUM default sehingga akan mencuri trafik vhost tetangga.
# Semua `server_name` dieja eksplisit dari DB.
#
# Itu juga sebabnya tidak ada blok ACME umum di file ini: challenge
# `/.well-known/acme-challenge/` dilayani blok port 80 milik masing-masing
# domain di file yang digenerate — yang memang ditulis SEBELUM certbot dipanggil,
# justru supaya challenge-nya punya `server_name` yang cocok. Blok ACME bersama
# harus punya `server_name` juga, jadi ia tidak akan menangkap apa pun yang
# belum tercakup.
include /opt/flo-event/nginx/custom-domains.conf;
